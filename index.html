<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #2c2c2c;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
    }
    #chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background-color: #007aff;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .ai {
      align-self: flex-start;
      background-color: #2c2c2e;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }
    #input-area {
      padding: 12px;
      background-color: #1e1e1e;
      display: flex;
      gap: 8px;
      border-top: 1px solid #2c2c2c;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid #3a3a3c;
      background-color: #2c2c2e;
      color: #fff;
      outline: none;
      font-size: 1rem;
    }
    button {
      padding: 8px 16px;
      border-radius: 20px;
      border: none;
      background-color: #007aff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>

  <header>Zeta AI Partner</header>
  <div id="chat-box">
    <div class="message ai">やあ！何か話そうよ。</div>
  </div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="メッセージを入力...">
    <button id="send-btn" onclick="sendMessage()">送信</button>
  </div>

  <script>
    // 1. ここにGoogle AI Studioで取得したAPIキーを貼り付けてください
    const API_KEY = "gen-lang-client-0958880744"; 

    // 2. Zetaのキャラクター設定（自由に書き換えてOK！）
    const SYSTEM_PROMPT = "あなたは親しみやすく、少しクールでチャーミングなAIパートナー「Zeta」です。フランクなタメ口で、短く軽快に会話してください。";

    let conversationHistory = [];

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const text = inputEl.value.trim();
      
      if (!text) return;
      if (API_KEY === "gen-lang-client-0958880744") {
        alert("コード内の API_KEY を取得したキーに書き換えてください！");
        return;
      }

      // ユーザーのメッセージを表示
      appendMessage(text, 'user');
      inputEl.value = '';
      sendBtn.disabled = true;

      // 会話履歴に追加
      conversationHistory.push({ role: "user", parts: [{ text: text }] });

      // AIの「入力中...」表示
      const loadingEl = appendMessage("入力中...", 'ai');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: conversationHistory
          })
        });

        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;

        // 入力中を消して実際の返答を表示
        loadingEl.innerText = reply;
        conversationHistory.push({ role: "model", parts: [{ text: reply }] });

      } catch (error) {
        loadingEl.innerText = "エラーが発生したみたい。APIキーを確認してみてね。";
        console.error(error);
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(text, side) {
      const chatBox = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.className = `message ${side}`;
      msg.innerText = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }
  </script>
</body>
</html>
